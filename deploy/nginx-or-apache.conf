# Farm Apache 2.4 vhost — HTTPS + HSTS
# Placeholders replaced by deploy/install.sh:
#   __DOMAIN__   __FARM_ROOT__   __PHP_SOCK__
#
# Install path: /etc/apache2/sites-available/farm.conf
# TLS material: /etc/ssl/farm/{fullchain,privkey}.pem  (replace with Let's Encrypt in prod)

<VirtualHost *:80>
    ServerName __DOMAIN__
    ServerAdmin admin@__DOMAIN__

    DocumentRoot __FARM_ROOT__/public

    # __HTTP_TO_HTTPS__ (install.sh enables redirect for real domains)
    # RewriteEngine On
    # RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    # RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]

    <Directory __FARM_ROOT__/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:__PHP_SOCK__|fcgi://localhost"
    </FilesMatch>
    DirectoryIndex index.php index.html

    # Live-view HTTP + WebSocket (noVNC). Requires: a2enmod proxy proxy_http proxy_wstunnel rewrite
    IncludeOptional __FARM_ROOT__/deploy/apache-live-view.conf

    # Screenshots (public/storage → ../storage symlink; Alias as fallback)
    Alias /storage/screenshots __FARM_ROOT__/storage/screenshots
    <Directory __FARM_ROOT__/storage/screenshots>
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    <Location /internal>
        Require local
        Require ip 10.0.0.0/8
        Require ip 172.16.0.0/12
        Require ip 192.168.0.0/16
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/farm-error.log
    CustomLog ${APACHE_LOG_DIR}/farm-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName __DOMAIN__
    ServerAdmin admin@__DOMAIN__

    DocumentRoot __FARM_ROOT__/public

    SSLEngine on
    SSLCertificateFile      /etc/ssl/farm/fullchain.pem
    SSLCertificateKeyFile   /etc/ssl/farm/privkey.pem
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder     on

    # HSTS — enable only when HTTPS is stable (includeSubDomains optional)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    <Directory __FARM_ROOT__/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # PHP-FPM (farm pool)
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:__PHP_SOCK__|fcgi://localhost"
    </FilesMatch>
    DirectoryIndex index.php index.html

    # Front controller via public/.htaccess (AllowOverride All)

    # Live-view proxy (noVNC) — worker binds 127.0.0.1:3000
    IncludeOptional __FARM_ROOT__/deploy/apache-live-view.conf

    Alias /storage/screenshots __FARM_ROOT__/storage/screenshots
    <Directory __FARM_ROOT__/storage/screenshots>
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # Internal API only from localhost / private net
    <Location /internal>
        Require local
        Require ip 10.0.0.0/8
        Require ip 172.16.0.0/12
        Require ip 192.168.0.0/16
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/farm-error.log
    CustomLog ${APACHE_LOG_DIR}/farm-access.log combined
    LogLevel warn
</VirtualHost>

