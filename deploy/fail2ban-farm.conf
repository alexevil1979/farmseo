# /etc/fail2ban/jail.d/farm.conf  (installed by deploy/install.sh)
# Protects Farm panel login + public API abuse.

[DEFAULT]
bantime  = 1h
findtime = 10m
maxretry = 8
backend  = systemd

[farm-api]
enabled  = true
port     = http,https
filter   = farm-api
logpath  = /var/log/apache2/farm-access.log
          /var/log/apache2/access.log
maxretry = 12
findtime = 5m
bantime  = 2h
action   = %(action_)s

[sshd]
enabled = true

[apache-auth]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/*error.log
maxretry = 5
bantime  = 1h

[apache-badbots]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/farm-access.log
          /var/log/apache2/access.log

[apache-noscript]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/*error.log
