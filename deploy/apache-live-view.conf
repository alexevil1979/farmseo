# Proxy live-view (noVNC / websockify) through the panel.
# Include from the farm vhost, e.g.:
#   IncludeOptional /opt/farm/deploy/apache-live-view.conf
#
# Browser → Apache /live/{accountId}/ → Worker :3000 /live/{accountId}/ → websockify → x11vnc → Xvfb

ProxyRequests Off
ProxyPreserveHost On

# HTTP (noVNC static + API)
ProxyPass        /live/  http://127.0.0.1:3000/live/
ProxyPassReverse /live/  http://127.0.0.1:3000/live/

# WebSocket upgrades (noVNC RFB tunnel)
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/live/(.*)$  ws://127.0.0.1:3000/live/$1 [P,L]
