server {
    listen 80;
    server_name site localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Seed a server-side cookie so profile Cookies DB is non-empty after visit
    add_header Set-Cookie "e2e_site=1; Path=/; Max-Age=86400" always;
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
