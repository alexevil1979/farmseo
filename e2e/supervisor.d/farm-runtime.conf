; Long-running runtime under supervisor (no systemd).

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -ac -nolisten tcp +extension RANDR
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/farm/xvfb.log
stderr_logfile=/var/log/farm/xvfb.err.log

[program:mysql]
command=/usr/sbin/mysqld --user=mysql --datadir=/var/lib/mysql --pid-file=/run/mysqld/mysqld.pid --socket=/var/run/mysqld/mysqld.sock
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/farm/mysql.log
stderr_logfile=/var/log/farm/mysql.err.log

[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/farm/redis.log
stderr_logfile=/var/log/farm/redis.err.log

[program:php-fpm]
command=/usr/sbin/php-fpm8.3 --nodaemonize --fpm-config /etc/php/8.3/fpm/php-fpm.conf
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/farm/php-fpm.log
stderr_logfile=/var/log/farm/php-fpm.err.log

[program:apache]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/farm/apache.log
stderr_logfile=/var/log/farm/apache.err.log

; Ambient VNC on shared DISPLAY :99 (session stacks use DISPLAY_BASE=100+)
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -rfbport 5900 -localhost -forever -shared -nopw -xkb -quiet
autostart=true
autorestart=true
priority=40
startsecs=2
stdout_logfile=/var/log/farm/x11vnc.log
stderr_logfile=/var/log/farm/x11vnc.err.log

[program:websockify]
; Bind 0.0.0.0 so host port 16080→6080 works (127.0.0.1 is unreachable via Docker publish)
command=/bin/bash -c 'command -v websockify >/dev/null && exec websockify --web=/usr/share/novnc 0.0.0.0:6080 localhost:5900 || exec python3 -m websockify --web=/usr/share/novnc 0.0.0.0:6080 localhost:5900'
autostart=true
autorestart=true
priority=45
startsecs=2
stdout_logfile=/var/log/farm/websockify.log
stderr_logfile=/var/log/farm/websockify.err.log

; Started by entrypoint AFTER mysql migrate (autostart=false avoids crash-loop on cold boot).
[program:farm-scheduler]
command=/usr/bin/php /opt/farm/farm sched:run --loop --sleep=5
directory=/opt/farm
user=farm
autostart=false
autorestart=true
startretries=10
startsecs=3
priority=50
environment=HOME="/opt/farm"
stdout_logfile=/var/log/farm/scheduler.log
stderr_logfile=/var/log/farm/scheduler.err.log

[program:farm-monitor]
command=/usr/bin/php /opt/farm/farm mon:watch --sleep=5
directory=/opt/farm
user=farm
autostart=false
autorestart=true
startretries=10
startsecs=3
priority=50
environment=HOME="/opt/farm"
stdout_logfile=/var/log/farm/monitor.log
stderr_logfile=/var/log/farm/monitor.err.log
