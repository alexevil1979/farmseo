; Isolated so e2e kill-test can flip autorestart without touching MySQL/Redis.

[program:farm-worker]
command=/usr/bin/node /opt/farm/workers/index.js
directory=/opt/farm/workers
user=farm
autostart=true
autorestart=true
stopwaitsecs=30
priority=50
environment=HOME="/opt/farm",NODE_ENV="production",WORKER_ID="w-1",WORKER_HTTP_PORT="3000",DISPLAY=":99",RANDOM_SEED="%(ENV_RANDOM_SEED)s",GEO_PROVIDER="%(ENV_GEO_PROVIDER)s",CHROME_EXTRA_ARGS="%(ENV_CHROME_EXTRA_ARGS)s",MAX_CHROME="%(ENV_MAX_CHROME)s",DISPLAY_BASE="100",VNC_BASE_PORT="5910",WEBSOCKIFY_BASE_PORT="6090"
stdout_logfile=/var/log/farm/supervisor-worker.log
stderr_logfile=/var/log/farm/supervisor-worker.err.log
